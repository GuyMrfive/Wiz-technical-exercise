
name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/tasky:latest
            ${{ secrets.ACR_NAME }}.azurecr.io/tasky:${{ github.sha }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/tasky:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/tasky:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/tasky:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-wiz-exercise \
            --name aks-wiz-exercise \
            --admin \
            --overwrite-existing

      - name: Install or upgrade NGINX Ingress
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.service.type=LoadBalancer \
            --wait \
            --timeout 5m

      - name: Create Kubernetes Secret
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SECRET_KEY: ${{ secrets.TASKY_SECRET_KEY }}
        run: |
          kubectl create secret generic tasky-secrets \
            --from-literal=mongodb-uri="$MONGODB_URI" \
            --from-literal=secret-key="$SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Deploy 
        run: |
          kubectl set image deployment/tasky \
            tasky=${{ secrets.ACR_NAME }}.azurecr.io/tasky:${{ github.sha }}
